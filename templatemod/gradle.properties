# JDK 24+ warns when Gradle loads its native library (JEP 472). Allow it.
org.gradle.jvmargs=-Xmx3G --enable-native-access=ALL-UNNAMED
org.gradle.parallel=false

# Mod metadata. The loader metadata files read these values.
# mod_id must match ExampleMod.MOD_ID and the name of <mod_id>.mixins.json.
mod_id=examplemod
mod_name=Example Mod
mod_version=0.1.0
mod_group_id=dev.psydvl.mc.example
mod_authors=psydvl
mod_description=Example mod of the PsyMC template.
mod_license=MIT
issue_tracker_url=https://example.invalid/issues

# Loaders of the mod. Remove nil to turn NilLoader off: settings then has no nil leaves, and
# -Ploader=nil stops with an error. docs/architecture.md lists the files to delete for good.
loaders=neoforge,fabric,nil

# One Fabric Loader for every pin and launch.
fabric_loader_version=0.19.5

# NilLoader that the nil jars compile against. A player installs it as a Java agent.
nilloader_version=1.4.1
# Lines that the nil patches print in a client launch before the sound startup. versionSmoke
# -Ploader=nil needs all of them. Separate them with commas. The headless vanilla client does not
# reach the title screen, so the TitleScreen patch has no line here; nilCheck checks its target.
nil_smoke_markers=[examplemod] loaded

# HeadlessMc LWJGL of the headless smoke clients. 3.0 adds the SDL window of 26.3.
headlessmc_version=3.0.0-RC7

# Mixin configs that mixinAudit loads. Separate them with commas.
mixin_configs=examplemod.mixins.json
# Optional for mixinCheck. A class with static boolean allow(String mixinClass, String release).
mixin_gate_class=dev.psydvl.mc.example.mixinplugin.MixinGate
# Optional for mixinCheck. The package of mixins that a config plugin adds from getMixins.
mixin_plugin_package=dev.psydvl.mc.example.mixin

# Shader pack for the optional Iris run (-Pcompat=iris). Modrinth project:version id.
compat_shaderpack=complementary-reimagined:Bqen1mJX
